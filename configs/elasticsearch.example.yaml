# Native metadata/query/batch/PIT/scroll/SQL/synchronous-EQL/ES|QL profile. Replace endpoint, UUID and secret/CA locations.
# ENRICH requires a separate explicit cluster snapshot data grant (disabled below).
# Experimental ES|QL pragmas require an explicit per-target resource profile (disabled below).
# Cross-cluster query execution and finer ENRICH isolation remain later stages.
server:
  transport: stdio
  strict_startup: true
  metrics_summary_interval: 30s

limits:
  global_concurrency: 16
  per_target_concurrency: 8
  default_timeout: 5m
  max_timeout: 10m
  max_result_bytes: 8388608

targets:
  search-reporting:
    engine: elasticsearch
    environment: production
    consistency: eventual
    username: search_mcp_ro
    password_env: READONLY_ES_PASSWORD
    # To use an API key instead, remove username/password_env and configure
    # elasticsearch.api_key as shown in the API-key qualification record.
    elasticsearch:
      endpoints: [https://es-reporting.example.invalid:9200]
      version: 8.19.21
      cluster_uuid: REPLACE_WITH_CLUSTER_ID
      allowed_indices: [reports-*]
      # Optional exact IDs exposed by es_metadata.operation=get_script.
      # Script/template query execution remains independently available.
      # readable_script_ids: [report-template]
      # Optional remote connection topology proof. This verifies an existing
      # local-cluster alias and API-key security model; remote queries remain
      # unavailable until remote key and index-scope execution proof is added.
      # remote_clusters:
      #   - alias: archive
      #     mode: proxy
      #     proxy_address: archive-proxy.example.invalid:9443
      #     allowed_indices: [logs-*]
      #     denied_indices: [logs-private-*]
      # Optional broad data grant: ALL past/current/future enrichment snapshots
      # in this cluster, independently of allowed_indices/denied_indices/DLS/FLS.
      # Also requires explicit monitor_enrich; never grant manage_enrich.
      # Use a separate cluster if snapshots need finer isolation.
      # enrich:
      #   scope: all_cluster_snapshots
      # Optional ES|QL pragma opt-in. Unspecified numeric ceilings leave that
      # individual resource control unavailable; ordinary ES|QL still works.
      # esql_pragmas:
      #   max_task_concurrency: 8
      #   max_page_size: 2048
      #   max_fold_bytes: 67108864
      #   max_fold_percent: 5
      #   min_status_interval: 100ms
      privilege_recheck_interval: 1m
      max_request_bytes: 1048576
      max_json_depth: 128
      max_json_nodes: 100000
      max_resolved_indices: 1024
      max_aggregation_buckets: 10000
      max_open_contexts: 32
      context_keep_alive: 5m
      max_context_lifetime: 30m
      max_context_id_bytes: 65536
      max_language_bytes: 262144
      max_language_tokens: 10000
      max_language_depth: 128
      max_eql_fetch_size: 10000
    tls:
      mode: verify-full
      ca_file: /run/secrets/es-ca.pem
      # Each configured endpoint's hostname is verified independently.
    connection:
      max_open: 8
      max_idle: 4
      connect_timeout: 15s
      write_timeout: 15s
      read_timeout: 11m
      max_lifetime: 30m
      max_idle_time: 10m
