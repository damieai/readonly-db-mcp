server:
  transport: stdio
  strict_startup: true
  metrics_summary_interval: 30s

limits:
  global_concurrency: 4
  per_target_concurrency: 2
  default_timeout: 3s
  max_timeout: 10s
  max_rows: 500
  max_result_bytes: 1048576
  max_cell_bytes: 65536
  max_sql_bytes: 32768
  max_batch_queries: 10
  max_parameters: 100
  max_parameter_bytes: 1048576
  max_parameter_value_bytes: 262144
  max_queued_requests: 32
  queue_timeout: 500ms
  workload_classes:
    metadata_reserved: 1
    batch_max_concurrency: 1
    maintenance_max_concurrency: 1

targets:
  inventory-test:
    engine: mysql
    environment: test
    consistency: current
    host: 127.0.0.1
    port: 3306
    database: inventory
    username: inventory_mcp_ro
    # The file contains only the password. It must not be committed and should
    # be readable only by the account running this MCP process.
    password_file: ./secrets/inventory-test.password
    allowed_schemas:
      - inventory
    mysql:
      privilege_recheck_interval: 5m
    connection:
      connect_timeout: 3s
      read_timeout: 12s
      write_timeout: 3s
      max_open: 2
      max_idle: 1
      max_lifetime: 3m
      max_idle_time: 1m
    tls:
      # Encrypted but certificate-unverified; use verify-full outside local tests.
      mode: required
    metadata_cache:
      enabled: true
      allow_fresh: true
      fresh_cooldown: 1s
      table_list_ttl: 20m
      table_description_ttl: 20m
      negative_ttl: 5s
      max_entries: 256
      max_bytes: 8388608

  reporting-production:
    engine: mysql
    environment: production
    consistency: eventual
    host: reporting-replica.internal.example
    port: 3306
    database: reporting_safe
    username: reporting_mcp_ro
    password_file: /run/secrets/reporting-production.password
    allowed_schemas:
      - reporting_safe
    # Deny sensitive objects even when the account has schema-level SELECT.
    denied_tables:
      - internal_credentials
      - reporting_safe.raw_customer_exports
    mysql:
      privilege_recheck_interval: 5m
    connection:
      connect_timeout: 3s
      read_timeout: 12s
      write_timeout: 3s
      max_open: 2
      max_idle: 1
      max_lifetime: 3m
      max_idle_time: 1m
    tls:
      mode: verify-full
      ca_file: /etc/readonly-db-mcp/ca.pem
      server_name: reporting-replica.internal.example
    metadata_cache:
      enabled: true
      allow_fresh: true
      fresh_cooldown: 1s
      table_list_ttl: 20m
      table_description_ttl: 20m
      negative_ttl: 5s
      max_entries: 256
      max_bytes: 8388608
    result_cache:
      enabled: false

  analytics-postgresql-test:
    engine: postgresql
    environment: test
    consistency: current
    host: 127.0.0.1
    port: 5432
    database: analytics
    username: analytics_mcp_ro
    password_file: ./secrets/analytics-postgresql-test.password
    allowed_schemas:
      - reporting
    connection:
      connect_timeout: 3s
      read_timeout: 12s
      write_timeout: 3s
      max_open: 2
      max_idle: 1
      max_lifetime: 3m
      max_idle_time: 1m
    postgresql:
      application_name: readonly-db-mcp
      statement_timeout_margin: 250ms
      batch_isolation: repeatable-read
      require_hot_standby: false
      privilege_recheck_interval: 5m
    tls:
      mode: required
    metadata_cache:
      enabled: true
      allow_fresh: true
      fresh_cooldown: 1s
      table_list_ttl: 20m
      table_description_ttl: 20m
      negative_ttl: 5s
      max_entries: 256
      max_bytes: 8388608

  finance-sqlserver-test:
    engine: sqlserver
    environment: test
    consistency: current
    host: 127.0.0.1
    port: 1433
    database: Finance
    username: finance_mcp_ro
    password_file: ./secrets/finance-sqlserver-test.password
    allowed_schemas:
      - reporting
    denied_tables:
      - reporting.raw_payroll
    connection:
      connect_timeout: 3s
      read_timeout: 12s
      write_timeout: 3s
      # SHOWPLAN preflight completes before execution, so no extra pool slot
      # is required beyond ordinary target concurrency.
      max_open: 2
      max_idle: 1
      max_lifetime: 3m
      max_idle_time: 1m
    sqlserver:
      application_name: readonly-db-mcp
      application_intent: read-only
      require_read_only_replica: false
      lock_timeout: 1500ms
      batch_isolation: snapshot
      require_snapshot_isolation: true
      privilege_recheck_interval: 5m
    tls:
      mode: required
    metadata_cache:
      enabled: true
      allow_fresh: true
      fresh_cooldown: 1s
      table_list_ttl: 20m
      table_description_ttl: 20m
      negative_ttl: 5s
      max_entries: 256
      max_bytes: 8388608

  analytics-redis-test:
    engine: redis
    environment: test
    consistency: current
    host: 127.0.0.1
    port: 6379
    username: analytics_mcp_ro
    password_file: ./secrets/analytics-redis-test.password
    redis:
      mode: standalone
      database: 0
      key_patterns:
        - "analytics:*"
      protocol: 3
      acl_recheck_interval: 5m
      command_catalog_max_age: 10m
      # Prefix-scoped targets keep this disabled because scripts can issue
      # keyless keyspace reads internally. It is supported for exact %R~* targets.
      allow_readonly_scripts: false
      max_script_bytes: 65536
      max_keys_per_command: 256
      max_argument_bytes: 262144
      max_reply_depth: 32
      max_reply_elements: 10000
      # Sentinel/Cluster targets omit top-level host/port. Their discovered
      # data nodes must match endpoint_allowlist.dns_suffixes or cidrs.
      # sentinel:
      #   service_name: analytics-cache
      #   addresses: ["sentinel-a.internal:26379", "sentinel-b.internal:26379"]
      #   username: readonly_discovery
      #   password_file: ./secrets/redis-sentinel.password
      #   min_agreement: 2
      #   discovery_timeout: 750ms
      #   refresh_interval: 5s
      #   read_role: primary
      #   require_master_link_up: true
      #   max_replica_lag_bytes: 16777216
      #   endpoint_allowlist:
      #     dns_suffixes: [".internal"]
      #     cidrs: ["10.20.0.0/16"]
      # cluster:
      #   seed_addresses: ["redis-a.internal:6379"]
      #   read_role: primary
      #   topology_refresh_interval: 5s
      #   topology_max_age: 30s
      #   redirect_limit: 3
      #   require_full_slot_coverage: true
      #   endpoint_allowlist:
      #     cidrs: ["10.30.0.0/16"]
      # Signed module envelopes and base64 Ed25519 public keys are configured
      # with module_profiles and trusted_profile_keys. Logical module object
      # scopes use uppercase command names, for example:
      # module_object_patterns:
      #   FT.SEARCH: ["tenant-42:*"]
    connection:
      connect_timeout: 3s
      read_timeout: 12s
      write_timeout: 3s
      max_open: 2
      max_idle: 1
      max_lifetime: 3m
      max_idle_time: 1m
    tls:
      mode: required
